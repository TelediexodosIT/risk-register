# One customer = one copy of this folder with its own .env.
# Start:   docker compose up -d --build
# Logs:    docker compose logs -f web
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: riskregister
      POSTGRES_USER: riskregister
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riskregister -d riskregister"]
      interval: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://riskregister:${DB_PASSWORD}@db:5432/riskregister
      MEDIA_ROOT: /app/media
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

  # Sends deadline reminders and overdue notices once an hour (each email is sent only once).
  scheduler:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://riskregister:${DB_PASSWORD}@db:5432/riskregister
    entrypoint: ["sh", "-c", "sleep 60; while true; do python manage.py send_reminders; sleep 3600; done"]
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      TLS_MODE: ${TLS_MODE:-auto}
      DEFAULT_SNI: ${DEFAULT_SNI:-localhost}
      ALLOWED_IPS: ${ALLOWED_IPS:-0.0.0.0/0 ::/0}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - web

volumes:
  db_data:
  media:
  caddy_data:
