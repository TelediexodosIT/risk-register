{% load static i18n %}{% get_current_language as LANG %}<!doctype html>
<html lang="{{ LANG }}">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% translate "Sign in" %}{% endblock %} · {{ APP_NAME }}</title>
<script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="{% static 'css/app.css' %}">
<link rel="icon" type="image/png" href="{% static 'img/favicon.png' %}">
</head>
<body>
<div class="login">
  <section class="login-brand">
    <div class="brand-center"><img class="logo-xl" src="{% static 'img/brainertek.png' %}" alt="BrainerTek"><b>{{ APP_NAME }}</b><small class="by">by BrainerTek</small></div>
  </section>
  <section class="login-panel">
    <div class="login-card">
      <div class="actions" style="justify-content:flex-end">{% include "_toggles.html" %}</div>
      {% if messages %}<div class="messages">{% for m in messages %}<div class="banner {{ m.tags }}">{{ m }}</div>{% endfor %}</div>{% endif %}
      {% block card %}{% endblock %}
    </div>
  </section>
</div>
<script src="{% static 'js/app.js' %}"></script>
</body>
</html>
