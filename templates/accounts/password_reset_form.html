{% extends "base_auth.html" %}
{% block title %}Forgot password{% endblock %}
{% block card %}
<div><h2>Forgot password</h2><p class="sub">Enter your work email. If it belongs to an account, we'll send a link to choose a new password.</p></div>
<form method="post" class="lform" novalidate>
  {% csrf_token %}
  <label class="f"><span>Work email</span><input type="email" name="email" autocomplete="email" required autofocus>{{ form.email.errors }}</label>
  <button class="btn primary wide" type="submit">Send reset link</button>
  <a class="link" href="{% url 'login' %}">Back to sign in</a>
</form>
{% endblock %}
