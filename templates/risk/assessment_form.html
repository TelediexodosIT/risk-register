{% extends "base.html" %}{% load i18n %}
{% block title %}{% translate "New assessment" %}{% endblock %}
{% block content %}
<a class="back" href="{% url 'assessment_list' %}">← {% translate "All assessments" %}</a>
<header class="page-h"><div><p class="eyebrow">{{ company.name }}</p><h1>{% translate "New assessment" %}</h1></div></header>
<form method="post" class="formpage">
  {% csrf_token %}
  <div class="step">
    <label class="f"><span>{% translate "Area or activity" %}</span><input type="text" name="title" value="{{ form.title.value|default:'' }}" placeholder="{% translate 'e.g. Kitchen and food preparation' %}" required autofocus>{{ form.title.errors }}</label>
    <label class="f"><span>{% translate "Site" %}</span><input type="text" name="site" value="{{ form.site.value|default:'' }}" placeholder="{% translate 'e.g. Head office' %}"></label>
  </div>
  <div class="actions"><a class="btn" href="{% url 'assessment_list' %}">{% translate "Cancel" %}</a><button class="btn primary">{% translate "Create assessment" %}</button></div>
</form>
{% endblock %}
