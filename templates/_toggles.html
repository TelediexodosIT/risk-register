{% load i18n %}{% get_current_language as LANG %}<button class="iconbtn" type="button" data-theme-toggle aria-label="{% translate 'Switch light / dark mode' %}" title="{% translate 'Light / dark mode' %}">
  <svg class="theme-light-icon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  <svg class="theme-dark-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
</button>
<form class="inline" method="post" action="{% url 'set_language' %}">{% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <input type="hidden" name="language" value="{% if LANG == 'el' %}en{% else %}el{% endif %}">
  <button class="iconbtn" type="submit" title="{% if LANG == 'el' %}English{% else %}Ελληνικά{% endif %}" aria-label="{% if LANG == 'el' %}Switch to English{% else %}Αλλαγή σε Ελληνικά{% endif %}">{% if LANG == 'el' %}EN{% else %}ΕΛ{% endif %}</button>
</form>
